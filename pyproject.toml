[project]
name = "veryon-wc"
version = "0.1.0"
description = "Python client library for the Veryon Workcenter (WC) REST API"
requires-python = ">=3.14"
dependencies = [
    "httpx>=0.28.1",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["veryon_wc"]
