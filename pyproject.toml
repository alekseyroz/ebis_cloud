[project]
name = "ebis-cloud"
version = "0.1.0"
description = "Python client library for the eBis Cloud REST API"
requires-python = ">=3.14"
dependencies = [
    "httpx>=0.28.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ebis_cloud"]
